name: Gift Code Radar

on:
  schedule:
    - cron: "0 */3 * * *" # Every 3 hours
  workflow_dispatch: # Manual trigger

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify Configuration
        env:
          WP_RADAR_TOKEN: ${{ secrets.WP_RADAR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "Checking if critical secrets are set..."
          if [ -z "$WP_RADAR_TOKEN" ]; then echo "::error ::WP_RADAR_TOKEN is missing in GitHub Secrets!"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error ::SUPABASE_URL is missing in GitHub Secrets!"; exit 1; fi
          echo "All critical secrets are present."

      - name: Run Gift Code Radar
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_RADAR_TOKEN: ${{ secrets.WP_RADAR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_gift_codes.py

      - name: Notify Failure (Discord Stub)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Sending failure notification to Discord..."
          # Example curl:
          # curl -H "Content-Type: application/json" -X POST -d '{"content": "⚠️ Gift Code Radar Failed!"}' $DISCORD_WEBHOOK_URL
          echo "STUB: Notification would be sent to Discord."
